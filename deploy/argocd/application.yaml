apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: curb-cut
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shravaniharish/curb-cut
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: curb-cut   # replace with your Radar namespace
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
